---
name: "CodeQL"

on:
  push:
    branches:
      - seera-main
      - release/*
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - seera-main
      - release/*
  schedule:
    - cron: '0 17 * * 1'

permissions: read-all

jobs:
  analyze:
    permissions:
      actions: read # for github/codeql-action/init to get workflow details
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/analyze to upload SARIF results
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: 'recursive'

      # Install dependencies and build submodules before starting analysis.
      #
      # No LTTng PPA. It publishes jammy and noble only, and this job runs on
      # ubuntu-latest, which is now 26.04: adding a suite that does not exist
      # makes `apt-get update` exit 100, and because this is a plain `run:`
      # block under `bash -e` the step dies there, before anything is built or
      # analysed. That is #210.
      #
      # Nothing is lost by dropping it. 26.04 ships liblttng-ust-dev 2.14 in
      # universe, newer than the 2.13 the PPA carries, and 22.04 and 24.04 --
      # where ubuntu-latest has been and where the packaging jobs still pin
      # themselves -- both ship 2.13. The PPA dates from 20.04, whose 2.11 was
      # too old.
      - run: |
         sudo apt-get update
         sudo apt-get install -y liblttng-ust-dev libnuma-dev
         sudo sh scripts/install-powershell-docker.sh
         mkdir build
         cd build
         cmake ..
         cmake --build . --target OpenSSL_Target

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: cpp
          config-file: ./.github/codeql/codeql-config.yml

      # Analyze this build.
      - run: |
         cd build
         cmake --build .

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
