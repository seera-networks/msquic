[package]
name = "seera-msquic"
version = "2.7.0-beta"
edition = "2021"
authors = ["Microsoft", "SEERA-Networks"]
description = "SEERA-Networks fork of Microsoft implementation of the IETF QUIC protocol"
readme = "README.md"
repository = "https://github.com/seera-networks/msquic/"
license = "MIT"
categories = ["network-programming", "asynchronous"]
keywords = ["quic", "network", "secure"]
build = "scripts/build.rs"
include = [
    "/README.md",
    "/*.toml",
    "/cmake",
    "/CMakeLists.txt",
    "/LICENSE",
    "/submodules/CMakeLists.txt",
    "/submodules/quictls/*.*",
    "/submodules/quictls/apps",
    "/submodules/quictls/CHANGES",
    "/submodules/quictls/config",
    "/submodules/quictls/Configure",
    "/submodules/quictls/Configurations",
    "/submodules/quictls/crypto",
    "/submodules/quictls/doc",
    "/submodules/quictls/engines",
    "/submodules/quictls/exporters",
    "/submodules/quictls/external",
    "/submodules/quictls/fuzz/*.c",
    "/submodules/quictls/fuzz/*.h", 
    "/submodules/quictls/fuzz/*.py",
    "/submodules/quictls/fuzz/*.pl",
    "/submodules/quictls/fuzz/build.info",
    "/submodules/quictls/include",
    "/submodules/quictls/ms",
    "/submodules/quictls/os-dep",
    "/submodules/quictls/providers",
    "/submodules/quictls/ssl",
    "/submodules/quictls/tools",
    "/submodules/quictls/util",
    "/submodules/openssl/*.*",
    "/submodules/openssl/apps",
    "/submodules/openssl/CHANGES",
    "/submodules/openssl/config",
    "/submodules/openssl/Configure",
    "/submodules/openssl/Configurations",
    "/submodules/openssl/crypto",
    "/submodules/openssl/engines",
    "/submodules/openssl/external",
    "/submodules/openssl/include",
    "/submodules/openssl/ms",
    "/submodules/openssl/os-dep",
    "/submodules/openssl/ssl",
    "/submodules/openssl/tools",
    "/submodules/openssl/fuzz/*.c",
    "/submodules/openssl/fuzz/*.h",
    "/submodules/openssl/fuzz/*.py",
    "/submodules/openssl/fuzz/*.pl",
    "/submodules/openssl/fuzz/build.info",
    "/submodules/openssl/doc",
    "/submodules/openssl/exporters",
    "/submodules/openssl/providers",
    "/submodules/openssl/util",
    "/submodules/xdp-for-windows/published/external",
    "/scripts/build.rs",
    "/src/**/*.rs",
    #
    # Narrowed to leave out the profile-guided optimization databases under
    # src/bin/*/pgo_*, which are 7MB of the repository and nothing the crate
    # can use: QUIC_PGO defaults OFF and scripts/build.rs never turns it on, so
    # CMakeLists only looks for a .pgd when a build this crate does not do asks
    # for one.
    #
    # The crate was 16KB under the 10MB crates.io limit this workflow enforces,
    # so the stage that added a few traces tipped it over -- the same way an
    # earlier one did, which is what narrowed /src/core and /src/platform
    # below. Dropping the PGO data gives back enough that the next change does
    # not have to think about it.
    #
    "/src/bin/*.*",
    "/src/bin/CMakeLists.txt",
    "/src/bin/darwin",
    "/src/bin/linux",
    "/src/bin/static",
    "/src/bin/winuser_fuzz",
    "/src/bin/winuser/*.*",
    "/src/bin/winkernel/*.*",
    #
    # Narrowed rather than naming the directories, so that the unit tests under
    # them stay out of the crate. QUIC_BUILD_TEST is OFF by default and
    # scripts/build.rs never turns it on, so nothing the crate builds reaches
    # them -- and the crate was within a few kilobytes of the 10MB crates.io
    # limit this workflow enforces, so a phase that adds files to either
    # directory tips it over. These two patterns give back about 760KB.
    #
    "/src/core/*.c",
    "/src/core/*.h",
    "/src/core/*.vcxproj",
    "/src/core/CMakeLists.txt",
    "/src/inc",
    "/src/generated",
    "/src/manifest",
    "/src/platform/*.c",
    "/src/platform/*.h",
    "/src/platform/*.vcxproj",
    "/src/platform/CMakeLists.txt",
    "/THIRD-PARTY-NOTICES",
]

[lib]
path = "src/rs/lib.rs"

[features]
default = ["src", "preview-api"]
# Build c code from source
src = [ "dep:cmake" ]
# Find prebuilt msquic. Use vcpkg installed location on Windows,
# while use system installed location on linux.
# MacOs is not supported.
find = []
# Windows uses schannel, and linux uses quictls by default.
# This feature enables quictls on windows, and has no effect on linux.
# This feature enables openssl on windows, and has no effect on linux.
openssl = []
openssl_external = []
quictls = []
static = ["src"]
preview-api = []
# Overwrite generated binding by reruning the bindgen
overwrite = [ "dep:bindgen" ]

[build-dependencies]
cmake = { version = "0.1", optional = true }
bindgen = { version = "0.72", optional = true }

[dependencies]
bitflags = "2.9"
libc = "0.2"
c-types = "6.0"
dtor = "1.0"
socket2 = "0.6"
